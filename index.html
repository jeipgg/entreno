<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Entrenamiento</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2F5384" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#12161A" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pole">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="app.css">
</head>
<body>

<!-- ============ CHECK-IN ============ -->
<div id="checkin" class="screen" hidden>
 <div class="ci-wrap">
 <p class="ci-kicker" id="ci-fecha"></p>
 <h1 class="ci-title" id="ci-title">¿Cómo llegas?</h1>

 <div class="ci-q">
 <label id="ci-energia">Energía</label>
 <div class="scale" data-field="energia" role="group" aria-label="Energía del 1 al 5">
 <button type="button" data-v="1">1</button><button type="button" data-v="2">2</button><button type="button" data-v="3">3</button><button type="button" data-v="4">4</button><button type="button" data-v="5">5</button>
 </div>
 <div class="scale-ends"><span>en el piso</span><span>bien</span></div>
 </div>

 <div class="ci-q">
 <label>Pesadez de piernas</label>
 <div class="scale" data-field="piernas" role="group" aria-label="Pesadez de piernas del 1 al 5">
 <button type="button" data-v="1">1</button><button type="button" data-v="2">2</button><button type="button" data-v="3">3</button><button type="button" data-v="4">4</button><button type="button" data-v="5">5</button>
 </div>
 <div class="scale-ends"><span>ligeras</span><span>muy pesadas</span></div>
 </div>

 <div class="ci-q">
 <label>¿Algo de esto pasó?</label>
 <div class="flags">
 <button type="button" class="flag" data-flag="irradiado">Hormigueo o corrientazo bajando por la pierna</button>
 <button type="button" class="flag" data-flag="lumbar">Dolor lumbar que lleva más de un día</button>
 <button type="button" class="flag" data-flag="sueno">Dos noches seguidas durmiendo mal</button>
 <button type="button" class="flag" data-flag="pulso">Pulso al despertar 8–10 latidos arriba</button>
 </div>
 </div>

 <button type="button" class="btn-primary" id="ci-go">Ver lo de hoy</button>
 <button type="button" class="btn-ghost" id="ci-skip">Saltar el check-in</button>
 </div>
</div>

<!-- ============ VEREDICTO ============ -->
<div id="veredicto" class="screen" hidden>
 <div class="ci-wrap">
 <div id="ver-card" class="verdict"></div>
 <button type="button" class="btn-primary" id="ver-go"></button>
 <button type="button" class="btn-ghost" id="ver-alt"></button>
 </div>
</div>

<!-- ============ APP ============ -->
<div id="app" hidden>

 <nav class="days" aria-label="Día de la semana">
 <div class="days-row" id="days-row"></div>
 <button type="button" class="badbtn" data-day="min" aria-pressed="false">Día malo — la sesión de 15 minutos</button>
 <div class="topbar">
 <div class="bar"><i id="barfill"></i></div>
 <b id="count">0 / 0</b>
 <span id="aviso" aria-live="polite"></span>
 <button type="button" class="linkbtn" id="btn-panel">progreso</button>
 </div>
 </nav>

 <main class="wrap" id="main"></main>

 <footer class="wrap foot" id="foot"></footer>
</div>

<!-- ============ CRONÓMETRO ============ -->
<div id="timer" class="timer" hidden>
 <div class="t-inner">
 <p class="t-label" id="t-label"></p>
 <div class="t-num" id="t-num">0:00</div>
 <p class="t-ex" id="t-ex"></p>
 <div class="t-next" id="t-next" hidden></div>
 <div class="t-actions">
 <button type="button" class="btn-ghost" id="t-less">−15s</button>
 <button type="button" class="btn-ghost" id="t-more">+15s</button>
 </div>
 <button type="button" class="btn-primary" id="t-close">Listo</button>
 </div>
</div>

<!-- ============ PANEL DE PROGRESO ============ -->
<div id="panel" class="sheet" hidden>
 <div class="sheet-inner">
 <div class="sheet-head">
 <h2>Lo que vas ganando</h2>
 <button type="button" class="linkbtn" id="panel-close">cerrar</button>
 </div>
 <div id="panel-body"></div>
 </div>
</div>

<!-- ============ INFOGRAFÍA ============ -->
<div id="figbox" class="sheet" hidden>
 <div class="sheet-inner">
 <div class="sheet-head">
 <h2 id="fig-title"></h2>
 <button type="button" class="linkbtn" id="fig-close">cerrar</button>
 </div>
 <div id="fig-body" class="fig-body"></div>
 </div>
</div>

<script src="app.js"></script>
</body>
</html>
