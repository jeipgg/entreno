<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="Dead bug: lumbar pegada frente a lumbar despegada">
<style>
 .bg{fill:none}
 .fig{fill:none;stroke:currentColor;stroke-width:7;stroke-linecap:round;stroke-linejoin:round}
 .head{fill:currentColor;stroke:none}
 .ground{stroke:currentColor;stroke-width:3;opacity:.35}
 .ok{stroke:#1F6B4A}
 .bad{stroke:#9C3327}
 .okf{fill:#1F6B4A}
 .badf{fill:#9C3327}
 .guide{stroke-width:3;stroke-dasharray:7 5;fill:none}
 .lbl{font:600 15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
 .cap{font:500 13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;opacity:.75}
 .tag{font:700 13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
</style>
<rect class="bg" width="640" height="400"/>
<text class="lbl" x="0" y="22">DEAD BUG</text><text class="cap" x="0" y="44">Mismo criterio que el hollow: la lumbar no se despega.</text><text class="tag okf" x="0" y="90">✓ Lumbar pegada</text><line class="ground" x1="0" y1="206" x2="300" y2="206"/><circle class="head" cx="46" cy="178" r="11"/><path class="fig " d="M60 182 L188 190 L262 196"/><path class="fig " d="M120 188 L146 128 L206 140"/><path class="fig " d="M84 184 L44 130"/><path class="guide ok" d="M64 200 L200 200"/><text class="cap" x="0" y="290">Si se despega, acorta el recorrido.</text><text class="tag badf" x="340" y="90">✗ Lumbar despegada</text><line class="ground" x1="340" y1="206" x2="640" y2="206"/><circle class="head" cx="386" cy="182" r="11"/><path class="fig " d="M400 186 Q476 166 552 194 L620 200"/><path class="fig " d="M470 178 L520 138"/><path class="fig " d="M424 188 L384 134"/><path class="guide bad" d="M442 180 Q478 158 512 178"/><text class="tag badf" x="452" y="152">hueco</text><text class="cap" x="340" y="290">La pierna bajó más de lo que aguanta el core.</text><text class="cap" x="0" y="340">Lento. Este ejercicio no se hace rápido nunca.</text><text class="cap" x="0" y="362">Exhala mientras extiendes la pierna.</text><text class="cap" x="0" y="384">Mano en la lumbar la primera vez, para sentir si se despega.</text></svg>
