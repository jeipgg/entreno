<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="Plancha con toque de hombro: cadera nivelada frente a cadera rotada">
<style>
 .bg{fill:none}
 .fig{fill:none;stroke:currentColor;stroke-width:7;stroke-linecap:round;stroke-linejoin:round}
 .head{fill:currentColor;stroke:none}
 .ground{stroke:currentColor;stroke-width:3;opacity:.35}
 .ok{stroke:#1F6B4A}
 .bad{stroke:#9C3327}
 .okf{fill:#1F6B4A}
 .badf{fill:#9C3327}
 .guide{stroke-width:3;stroke-dasharray:7 5;fill:none}
 .lbl{font:600 15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
 .cap{font:500 13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;opacity:.75}
 .tag{font:700 13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
</style>
<rect class="bg" width="640" height="400"/>
<text class="lbl" x="0" y="22">PLANCHA CON TOQUE DE HOMBRO</text><text class="cap" x="0" y="44">La cadera no rota ni un grado cuando levantas la mano.</text><text class="tag okf" x="0" y="90">✓ Cadera nivelada</text><line class="ground" x1="0" y1="212" x2="300" y2="212"/><circle class="head" cx="46" cy="128" r="11"/><path class="fig " d="M60 134 L160 150 L266 158"/><path class="fig " d="M78 138 L74 210"/><path class="fig " d="M250 158 L262 210"/><path class="fig " d="M60 134 L96 108"/><path class="guide ok" d="M150 140 L150 176"/><text class="tag okf" x="158" y="168">nivelada</text><text class="cap" x="0" y="290">Separa más los pies si te cuesta.</text><text class="tag badf" x="340" y="90">✗ Cadera rotada</text><line class="ground" x1="340" y1="212" x2="640" y2="212"/><circle class="head" cx="386" cy="128" r="11"/><path class="fig " d="M400 134 L500 144 L606 176"/><path class="fig " d="M418 138 L414 210"/><path class="fig " d="M592 176 L602 210"/><path class="fig " d="M400 134 L436 106"/><path class="guide bad" d="M498 130 L508 172"/><text class="tag badf" x="514" y="152">gira</text><text class="cap" x="340" y="290">Al rotar, la carga se va a la lumbar.</text><text class="cap" x="0" y="340">El toque es lento: no es velocidad, es control.</text><text class="cap" x="0" y="362">Glúteo apretado todo el tiempo.</text><text class="cap" x="0" y="384">Exhala en cada toque. Si aguantas el aire, todavía está difícil.</text></svg>
