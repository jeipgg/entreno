<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="Puente a una pierna: pelvis nivelada frente a pelvis caída">
<style>
 .bg{fill:none}
 .fig{fill:none;stroke:currentColor;stroke-width:7;stroke-linecap:round;stroke-linejoin:round}
 .head{fill:currentColor;stroke:none}
 .ground{stroke:currentColor;stroke-width:3;opacity:.35}
 .ok{stroke:#1F6B4A}
 .bad{stroke:#9C3327}
 .okf{fill:#1F6B4A}
 .badf{fill:#9C3327}
 .guide{stroke-width:3;stroke-dasharray:7 5;fill:none}
 .lbl{font:600 15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
 .cap{font:500 13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;opacity:.75}
 .tag{font:700 13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
</style>
<rect class="bg" width="640" height="400"/>
<text class="lbl" x="0" y="22">PUENTE DE GLÚTEO A UNA PIERNA</text><text class="cap" x="0" y="44">La pelvis no se inclina hacia el lado sin apoyo.</text><text class="tag okf" x="0" y="90">✓ Pelvis nivelada</text><line class="ground" x1="0" y1="212" x2="300" y2="212"/><circle class="head" cx="40" cy="176" r="11"/><path class="fig " d="M54 174 L140 146 L186 150"/><path class="fig " d="M186 150 L212 210"/><path class="fig " d="M186 148 L246 122"/><path class="guide ok" d="M132 138 L192 138"/><text class="cap" x="0" y="290">Pausa de 2 segundos arriba.</text><text class="tag badf" x="340" y="90">✗ Pelvis caída</text><line class="ground" x1="340" y1="212" x2="640" y2="212"/><circle class="head" cx="380" cy="182" r="11"/><path class="fig " d="M394 180 L480 162 L526 178"/><path class="fig " d="M526 178 L552 210"/><path class="fig " d="M526 176 L586 156"/><path class="guide bad" d="M472 152 L534 172"/><text class="tag badf" x="478" y="146">se inclina</text><text class="cap" x="340" y="290">Vuelve a dos piernas si la pelvis se cae.</text><text class="cap" x="0" y="340">El ejercicio más terapéutico de tu semana: el glúteo fuerte quita la curva de la espalda.</text><text class="cap" x="0" y="362">Empuja con el talón, no con la punta del pie.</text><text class="cap" x="0" y="384">Exhala al subir.</text></svg>
