<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="Bisagra de cadera: columna neutra frente a espalda redondeada">
<style>
 .bg{fill:none}
 .fig{fill:none;stroke:currentColor;stroke-width:7;stroke-linecap:round;stroke-linejoin:round}
 .head{fill:currentColor;stroke:none}
 .ground{stroke:currentColor;stroke-width:3;opacity:.35}
 .ok{stroke:#1F6B4A}
 .bad{stroke:#9C3327}
 .okf{fill:#1F6B4A}
 .badf{fill:#9C3327}
 .guide{stroke-width:3;stroke-dasharray:7 5;fill:none}
 .lbl{font:600 15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
 .cap{font:500 13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;opacity:.75}
 .tag{font:700 13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
</style>
<rect class="bg" width="640" height="400"/>
<text class="lbl" x="0" y="22">BISAGRA DE CADERA</text><text class="cap" x="0" y="44">Es extensión de CADERA, nunca de lumbar. La espalda no se mueve.</text><text class="tag okf" x="0" y="90">✓ Columna neutra</text><line class="ground" x1="0" y1="216" x2="300" y2="216"/><circle class="head" cx="64" cy="112" r="11"/><path class="fig " d="M76 118 L150 146"/><path class="fig " d="M150 146 L146 214"/><path class="fig " d="M112 132 L118 186"/><path class="guide ok" d="M72 112 L156 146"/><text class="cap" x="0" y="290">La cadera va atrás, no la espalda abajo.</text><text class="tag badf" x="340" y="90">✗ Espalda redondeada</text><line class="ground" x1="340" y1="216" x2="640" y2="216"/><circle class="head" cx="404" cy="122" r="11"/><path class="fig " d="M416 128 Q460 128 490 152"/><path class="fig " d="M490 152 L486 214"/><path class="fig " d="M452 140 L458 190"/><path class="guide bad" d="M416 124 Q460 122 494 150"/><text class="tag badf" x="420" y="108">se curva</text><text class="cap" x="340" y="290">Con disco degenerado, esto es lo que no debe pasar.</text><text class="cap" x="0" y="340">Si dudas de la técnica, hazlo sin peso. En serio.</text><text class="cap" x="0" y="362">Un palo de escoba en la espalda debe tocar cabeza, dorsal y sacro.</text><text class="cap" x="0" y="384">RPE 5–6 en este ejercicio. No es un día de récords.</text></svg>
